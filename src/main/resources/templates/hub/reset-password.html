<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>새 비밀번호 설정 · 링크 허브</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/icon/linkhub/linkhub-favicon.svg}" />
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon/linkhub/favicon-32.png}" />
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/icon/linkhub/favicon-16.png}" />
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icon/linkhub/app-icon-180.png}" />
  <link rel="shortcut icon" th:href="@{/icon/linkhub/favicon-32.png}" />
  <link rel="stylesheet" th:href="@{/assets/css/hub.css}" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hubTheme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 저장소 접근 불가면 기본값(라이트) */ }
    })();
  </script>
</head>
<body class="hub-body">
  <main class="auth-shell">
    <form class="auth-form" th:action="@{/hub/reset-password}" method="post">
      <span class="auth-logo" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>

      <h1 class="auth-title">새 비밀번호 설정</h1>
      <p class="auth-sub">확인이 끝났습니다. 새 비밀번호를 정해주세요.</p>

      <div th:if="${resetError}" class="auth-err" th:text="${resetError}"></div>

      <div class="auth-field">
        <label for="password">새 비밀번호</label>
        <!--/* 길이·문자 종류 제한을 두지 않기로 했다(2026-08-30 결정).
               지키지도 않을 규칙을 적어두면 사용자는 그 규칙에 맞춰 입력하고,
               다음 사람은 서버에 검증이 있다고 믿는다. 그래서 안내 문구도 두지 않는다. */-->
        <input class="hub-input" type="password" id="password" name="password"
               autocomplete="new-password" required />
      </div>
      <div class="auth-field">
        <label for="passwordConfirm">새 비밀번호 확인</label>
        <input class="hub-input" type="password" id="passwordConfirm" name="passwordConfirm"
               autocomplete="new-password" required />
      </div>

      <button type="submit" class="hub-btn hub-btn--primary hub-btn--block">비밀번호 변경</button>

      <p class="auth-alt">
        변경하면 다른 기기의 <b>이 기기 기억하기</b> 로그인이 모두 해제됩니다.
      </p>
    </form>
  </main>
</body>
</html>
