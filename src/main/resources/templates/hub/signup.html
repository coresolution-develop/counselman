<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 · 링크 허브</title>
  <link rel="stylesheet" th:href="@{/assets/css/hub.css}" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hubTheme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 저장소 접근 불가면 기본값(라이트) */ }
    })();
  </script>
</head>
<body class="hub-body">
  <main class="auth-shell">
    <form class="auth-form" th:action="@{/hub/signup}" method="post">
      <span class="auth-logo" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>

      <h1 class="auth-title">회원가입</h1>
      <p class="auth-sub">사내 가입코드로 계정을 만들고 개인 링크 공간을 시작하세요.</p>

      <div th:if="${signupError}" class="auth-err" th:text="${signupError}"></div>

      <div class="auth-field">
        <label for="email">이메일</label>
        <input class="hub-input" type="email" id="email" name="email" th:value="${email}"
               autocomplete="username" required />
      </div>
      <div class="auth-field">
        <label for="name">이름</label>
        <input class="hub-input" type="text" id="name" name="name" th:value="${name}"
               autocomplete="name" required />
      </div>
      <div class="auth-field">
        <label for="password">비밀번호</label>
        <input class="hub-input" type="password" id="password" name="password"
               autocomplete="new-password" required />
        <div class="hub-strength" data-strength-for="password" style="margin-top:8px">
          <div class="hub-strength__bars" aria-hidden="true">
            <span class="hub-strength__bar"></span>
            <span class="hub-strength__bar"></span>
            <span class="hub-strength__bar"></span>
          </div>
          <span class="hub-strength__text" role="status" aria-live="polite"></span>
        </div>
        <p class="auth-rule">8자 이상, 영문·숫자 포함</p>
      </div>
      <div class="auth-field">
        <span class="auth-field__label">
          <label for="signupCode">가입코드</label>
          <span class="auth-field__aside">관리자에게 발급 요청</span>
        </span>
        <input class="hub-input hub-input--mono" type="text" id="signupCode" name="signupCode"
               autocomplete="off" required />
      </div>

      <button type="submit" class="hub-btn hub-btn--primary hub-btn--block">가입하기</button>

      <p class="auth-alt">
        이미 계정이 있으신가요? <a th:href="@{/hub/login}">로그인</a>
        · <a th:href="@{/links}">허브로 돌아가기</a>
      </p>
    </form>
  </main>
  <script th:src="@{/js/hub-strength.js}"></script>
</body>
</html>
