<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
  <!--
    공통 사이드바. 사용:
      <div th:replace="~{hub/fragments/shell :: sidebar('hub', ${hubMember})}"></div>
    active: 'hub' | 'admin' | 'account'  /  member: HubMemberSession 또는 null(공개 허브)
    분류 목록은 ${categoryNav}가 있을 때만 렌더한다(허브 메인에서만 내려준다).
  -->
  <aside th:fragment="sidebar(active, member)" class="hub-sidebar">
    <div class="hub-brand">
      <span class="hub-brand__logo" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>
      <span class="hub-brand__name">링크 허브</span>
    </div>

    <nav class="hub-nav">
      <a th:href="@{/links}" class="hub-nav__item" th:classappend="${active == 'hub'} ? ' hub-nav__item--active'">
        <svg class="hub-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5" /><path d="M5 10v10h14V10" /></svg>
        <span>허브</span>
      </a>
      <a th:href="@{/admin/company-links}" class="hub-nav__item" th:classappend="${active == 'admin'} ? ' hub-nav__item--active'">
        <svg class="hub-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h10" /></svg>
        <span>링크 관리</span>
      </a>
      <a th:href="@{/hub/me/account}" class="hub-nav__item" th:classappend="${active == 'account'} ? ' hub-nav__item--active'">
        <svg class="hub-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" /></svg>
        <span>계정 설정</span>
      </a>
    </nav>

    <!--/* 분류 목록 — 클릭하면 본문의 해당 그룹으로 이동 */-->
    <th:block th:if="${categoryNav != null and !#lists.isEmpty(categoryNav)}">
      <div class="hub-side-label">분류</div>
      <div class="hub-cats">
        <a class="hub-cats__item" th:each="cat : ${categoryNav}"
           th:href="'#cat-' + ${cat.name}"
           th:style="|--c:${cat.color};--c-dark:${cat.colorDark}|">
          <span class="hub-cats__dot" aria-hidden="true"></span>
          <span class="hub-cats__name" th:text="${cat.name}">분류</span>
          <span class="hub-cats__count" th:text="${cat.count}">0</span>
        </a>
      </div>
    </th:block>

    <div class="hub-sidebar__spacer"></div>

    <!-- 로그인 상태: 프로필 + 로그아웃 -->
    <div th:if="${member != null}" class="hub-profile">
      <span class="hub-profile__avatar" th:text="${#strings.substring(member.name, 0, 1)}">이</span>
      <div class="hub-profile__meta">
        <div class="hub-profile__name" th:text="|${member.name}님|">이수민님</div>
        <div class="hub-profile__mail" th:text="${member.email}">a@coresolution.kr</div>
      </div>
      <form th:action="@{/hub/logout}" method="post" class="hub-inline-form">
        <button type="submit" class="hub-profile__logout" title="로그아웃" aria-label="로그아웃">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /></svg>
        </button>
      </form>
    </div>
    <!-- 비로그인: 로그인 버튼 -->
    <a th:if="${member == null}" th:href="@{/hub/login}" class="hub-profile__login">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><path d="M10 17l5-5-5-5" /><path d="M15 12H3" /></svg>
      <span>로그인</span>
    </a>
  </aside>
</body>
</html>
