<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 찾기 · 링크 허브</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/icon/linkhub/linkhub-favicon.svg}" />
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icon/linkhub/favicon-32.png}" />
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/icon/linkhub/favicon-16.png}" />
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icon/linkhub/app-icon-180.png}" />
  <link rel="shortcut icon" th:href="@{/icon/linkhub/favicon-32.png}" />
  <link rel="stylesheet" th:href="@{/assets/css/hub.css}" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hubTheme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 저장소 접근 불가면 기본값(라이트) */ }
    })();
  </script>
</head>
<body class="hub-body">
  <main class="auth-shell">
    <form class="auth-form" th:action="@{/hub/find-password}" method="post">
      <span class="auth-logo" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </span>

      <h1 class="auth-title">비밀번호 찾기</h1>
      <p class="auth-sub">가입할 때 쓴 이메일 · 이름 · 가입코드를 확인하면 새 비밀번호를 정할 수 있습니다.</p>

      <div th:if="${resetError}" class="auth-err" th:text="${resetError}"></div>

      <div class="auth-field">
        <label for="email">이메일</label>
        <input class="hub-input" type="email" id="email" name="email" th:value="${email}"
               autocomplete="username" required />
      </div>
      <div class="auth-field">
        <label for="name">이름</label>
        <input class="hub-input" type="text" id="name" name="name" th:value="${name}"
               autocomplete="name" maxlength="100" required />
      </div>
      <!--/* 가입과 같은 게이트. 이메일·이름은 사내에서 추측 가능한 값이라 이 코드가
             실제 방어선이다(HubMemberService.verifyForReset 주석 참고). */-->
      <div class="auth-field">
        <label for="signupCode">가입코드</label>
        <input class="hub-input hub-input--mono" type="text" id="signupCode" name="signupCode"
               autocomplete="off" required />
        <p class="auth-rule">회원가입 때 입력한 사내 코드와 같습니다.</p>
      </div>

      <button type="submit" class="hub-btn hub-btn--primary hub-btn--block">확인</button>

      <p class="auth-alt">
        <a th:href="@{/hub/login}">로그인으로 돌아가기</a>
        · <a th:href="@{/links}">허브로 돌아가기</a>
      </p>
    </form>
  </main>
</body>
</html>
