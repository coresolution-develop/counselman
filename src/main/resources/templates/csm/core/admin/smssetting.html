<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<title>문자관리 : SOSYGE EASY-CRM</title>
<link rel="shortcut icon" th:href="@{/icon/counselman/favicon-32.png}">
<link rel="apple-touch-icon" sizes="180x180" th:href="@{/icon/counselman/app-icon-180.png}">
<link rel="icon" sizes="192x192" th:href="@{/icon/counselman/app-icon-512.png}">
<script src="https://code.jquery.com/jquery-3.6.0.js"></script>
<link rel="stylesheet" th:href="@{/css/reset.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/common.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/style.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/header.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/cate.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/button.css}">
<link rel="stylesheet" th:href="@{/css/csm/Include/spinner.css}">
<link rel="stylesheet" th:href="@{/css/csm/core/admin/admin.css}">
<link rel="stylesheet" th:href="@{/css/csm/core/admin/style.css}">
<link rel="stylesheet" th:href="@{/css/csm/core/admin/smssetting.css}">
<link rel="stylesheet" th:href="@{/css/csm/core/popup/popup.css}">
</head>
<body>
<div th:replace="~{csm/Include/layout :: header(info=${info})}"></div>
<div th:replace="~{csm/Include/layout :: nav_section2('smssetting', '', '', '')}"></div>
<div class="main">
  <div class="section">
    <div class="content-mid">
      <div class="section-mid">
        <div class="smsTemplateDiv" style="width: 100%;" id="myTable">
          <!-- 단가 출처 안내 (CSM-2).
               "MediCast 가 관리한다" 만 적으면 폴링이 멈춰도 화면이 똑같아 보인다.
               그래서 기관마다 마지막 수신 시각을 같이 보여준다 — 낡은 것 자체가 신호다. -->
          <div class="price-source-notice">
            단가는 <strong>MediCast</strong> 에서 관리합니다. 이 화면에서는 수정할 수 없습니다.
          </div>
          <div class="sms-history-grid4">
            <div class="grid-header4" style="grid-template-columns: 180px 1fr 1fr 1fr;">
              <div>기관명</div>
              <div>단가(SMS/LMS/MMS)</div>
              <div>단가 수신</div>
              <div>상태</div>
            </div>
          </div>
          <div class="grid-body4">
            <div class="grid-row4" th:if="${#lists.isEmpty(list)}">
              <div>기관이 없습니다.</div>
            </div>
            <div class="grid-row4"
                 th:each="l : ${list}"
                 th:if="${l != null and !#strings.equalsIgnoreCase(l.id_col_03, 'core')}"
                 th:with="ps=${priceStatus != null ? priceStatus.get(l.id_col_03) : null}"
                 th:attr="data-inst-code=${l.id_col_03}">
              <div th:text="${l.id_col_02}"></div>
              <div th:text="|${l.sms_price} / ${l.lms_price} / ${l.mms_price}|"></div>
              <div class="price-received"
                   th:classappend="${ps != null and ps.stale} ? ' is-stale' : ''"
                   th:title="${ps != null} ? ${ps.detail} : ''">
                <span th:if="${ps != null and ps.stale}">⚠ </span>
                <span th:text="${ps != null and ps.version != null} ? ${ps.version} : '-'"></span>
                <span class="price-received__age"
                      th:text="${ps != null} ? ${ps.ageText} : '수신 이력 없음'"></span>
              </div>
              <div th:text="${l.id_col_04}"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="section-bot">
        <div class="search-status-area">
          <div><span>검색수 : <span class="count" th:text="|${instCount}건|"></span></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
