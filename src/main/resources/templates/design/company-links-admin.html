<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title>링크 관리 · 링크 허브</title>
  <link rel="stylesheet" th:href="@{/assets/css/hub.css}" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('hubTheme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 저장소 접근 불가면 기본값(라이트) */ }
    })();
  </script>
</head>
<body class="hub-body">
  <div class="hub-layout">
    <div th:replace="~{hub/fragments/shell :: sidebar('admin', ${hubMember})}"></div>

    <main class="hub-content">
      <div class="hub-main">
        <header class="adm-head">
          <h1 class="adm-head__title">링크 관리</h1>
          <span class="adm-head__sub"
                th:text="|공용 ${publicCount}개 · ${#lists.size(categoryRows)}개 분류|">공용 0개 · 0개 분류</span>
          <div class="adm-head__actions">
            <button type="button" class="hub-btn hub-btn--primary hub-btn--sm" data-drawer-open="addDrawer">링크 추가</button>
          </div>
        </header>

        <div th:if="${linkMessage}" class="hub-alert hub-alert--ok" th:text="${linkMessage}"></div>
        <div th:if="${linkError}" class="hub-alert hub-alert--err" th:text="${linkError}"></div>

        <nav class="adm-tabs" role="tablist">
          <button type="button" class="adm-tab adm-tab--on" role="tab" data-tab="links" aria-selected="true">링크</button>
          <button type="button" class="adm-tab" role="tab" data-tab="cats" aria-selected="false">분류 순서</button>
          <button type="button" class="adm-tab" role="tab" data-tab="notice" aria-selected="false">공지</button>
        </nav>

        <!--/* 탭 1 · 링크 ---------------------------------------------------- */-->
        <section class="adm-panel-tab" data-tab-panel="links">
          <div class="adm-toolbar" th:if="${!#lists.isEmpty(linkRows)}">
            <input class="hub-input" type="search" id="manageSearch" placeholder="이름 · 분류 · host 검색"
                   autocomplete="off" aria-label="링크 검색" />
            <select class="adm-select" id="manageCat" aria-label="분류 필터">
              <option value="">분류 전체</option>
              <option th:each="cat : ${categoryRows}" th:value="${cat.name}" th:text="${cat.name}">분류</option>
            </select>
            <select class="adm-select" id="manageEnv" aria-label="환경 필터">
              <option value="">환경 전체</option>
              <option value="prod">운영</option>
              <option value="dev">개발</option>
              <option value="demo">DEMO</option>
            </select>
          </div>

          <div class="hub-empty" th:if="${#lists.isEmpty(linkRows)}">
            <div class="hub-empty__text">등록된 링크가 없습니다.</div>
          </div>

          <div class="adm-table" th:if="${!#lists.isEmpty(linkRows)}">
            <div class="adm-tr adm-tr--head">
              <span>환경</span><span>분류</span><span>이름</span><span>URL</span><span>분류명</span>
              <span style="text-align:right">순서 · 작업</span>
            </div>
            <th:block th:each="row : ${linkRows}">
              <div class="adm-tr adm-tr--body" th:classappend="|env-${row.env}|"
                   data-adm-row
                   th:data-name="${row.title}" th:data-host="${row.host}"
                   th:data-cat="${row.category}" th:data-env="${row.env}">
                <span class="lh-env" th:text="${row.envLabel}">운영</span>
                <span class="lh-badge" th:style="|--c:${row.catColor};--c-dark:${row.catColorDark}|"
                      th:text="${row.catShort}">코어</span>
                <span class="adm-cell adm-cell--name" th:text="${row.title}">서비스명</span>
                <span class="adm-cell adm-cell--url" th:text="${row.url}" th:title="${row.url}">https://example.com</span>
                <span class="adm-cell adm-cell--cat" th:text="${row.category}">분류</span>
                <span class="adm-tail">
                  <span class="adm-order" th:text="${row.sortOrder}">0</span>
                  <span class="adm-rowact">
                    <button type="button" th:data-edit-toggle="${row.id}"
                            th:aria-label="|${row.title} 편집|" title="편집">✎</button>
                    <button type="button" class="adm-del" th:data-del-toggle="${row.id}"
                            th:aria-label="|${row.title} 삭제|" title="삭제">✕</button>
                  </span>
                </span>
              </div>

              <div class="adm-editrow" th:id="'edit-' + ${row.id}" hidden>
                <form th:action="@{/admin/company-links/{id}(id=${row.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <div class="hub-form__row">
                    <div class="hub-field"><label>이름</label>
                      <input class="hub-input" type="text" name="title" maxlength="100" required th:value="${row.title}" /></div>
                    <div class="hub-field"><label>분류</label>
                      <input class="hub-input" type="text" name="category" maxlength="80" th:value="${row.category}" /></div>
                  </div>
                  <div class="hub-form__row" style="margin-top:12px">
                    <div class="hub-field"><label>URL</label>
                      <input class="hub-input" type="url" name="url" maxlength="500" required th:value="${row.url}" /></div>
                    <div class="hub-field"><label>정렬 순서</label>
                      <input class="hub-input" type="number" name="sortOrder" min="0" max="9999" th:value="${row.sortOrder}" /></div>
                  </div>
                  <div class="hub-field" style="margin-top:12px"><label>설명</label>
                    <textarea class="hub-textarea" name="description" maxlength="500"
                              th:text="${row.description}"></textarea></div>
                  <div class="hub-edit__actions" style="margin-top:12px;justify-content:flex-end">
                    <button class="hub-btn hub-btn--primary hub-btn--sm" type="submit">수정</button>
                  </div>
                </form>
              </div>

              <div class="adm-editrow" th:id="'del-' + ${row.id}" hidden>
                <form th:action="@{/admin/company-links/{id}/delete(id=${row.id})}" method="post"
                      style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <span style="font-size:12.5px;color:var(--fg2)"
                        th:text="|'${row.title}' 링크를 삭제할까요? 되돌릴 수 없습니다.|">삭제할까요?</span>
                  <button class="hub-btn hub-btn--sm hub-btn--danger" type="submit">삭제</button>
                  <button class="hub-btn hub-btn--sm" type="button" th:data-del-toggle="${row.id}">취소</button>
                </form>
              </div>
            </th:block>
          </div>
        </section>

        <!--/* 탭 2 · 분류 순서 ------------------------------------------------ */-->
        <section class="adm-panel-tab" data-tab-panel="cats" hidden>
          <div class="adm-split">
            <div>
              <div class="adm-toolbar">
                <span class="hub-form__hint" style="margin-right:auto">행을 끌어 순서를 바꾼 뒤 저장하세요.</span>
                <span id="catOrderMsg" style="font-size:11.5px;color:var(--env-prod);display:none">저장됐습니다.</span>
                <button class="hub-btn hub-btn--primary hub-btn--sm" type="button" id="catOrderSave"
                        th:data-url="@{/admin/company-links/category-order}">순서 저장</button>
              </div>
              <div class="adm-catlist" id="catOrderList">
                <div class="adm-catrow" th:each="cat : ${categoryRows}" draggable="true"
                     th:data-cat="${cat.name}">
                  <span class="adm-cathandle" aria-hidden="true">⠿</span>
                  <span class="adm-catdot" aria-hidden="true"
                        th:style="|--c:${cat.color};--c-dark:${cat.colorDark}|"></span>
                  <span class="adm-catname" th:text="${cat.name}">분류</span>
                  <span class="adm-catcount" th:text="${cat.count}">0</span>
                  <span class="adm-catorder" data-cat-order th:text="${cat.sortOrder}">0</span>
                </div>
              </div>
              <div class="hub-empty" th:if="${#lists.isEmpty(categoryRows)}">
                <div class="hub-empty__text">분류가 없습니다. 링크에 분류를 지정하면 여기에 나타납니다.</div>
              </div>
            </div>
            <div class="adm-hint">
              분류 색상은 지금 분류명에 따라 자동 배정됩니다.<br />
              색상을 직접 고르려면 분류 색상 컬럼이 필요합니다 (2단계).
            </div>
          </div>
        </section>

        <!--/* 탭 3 · 공지 ---------------------------------------------------- */-->
        <section class="adm-panel-tab" data-tab-panel="notice" hidden>
          <div class="adm-notice-split">
            <form th:action="@{/admin/company-links/notice}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="hub-field">
                <label for="noticeMessage">메시지 (비우면 배너 숨김)</label>
                <textarea class="hub-textarea" id="noticeMessage" name="message" rows="3" maxlength="500"
                          placeholder="예) EMR 점검 중입니다 (오늘 14:00까지)"
                          th:text="${notice != null ? notice.message : ''}"></textarea>
              </div>
              <div class="hub-form__row" style="margin-top:12px">
                <div class="hub-field">
                  <label for="noticeLevel">강조</label>
                  <select class="adm-select" id="noticeLevel" name="level" style="height:38px">
                    <option value="info" th:selected="${notice == null or notice.level != 'warn'}">안내 (파랑)</option>
                    <option value="warn" th:selected="${notice != null and notice.level == 'warn'}">주의 (주황)</option>
                  </select>
                </div>
                <div class="hub-field">
                  <label>노출</label>
                  <label class="hub-check" style="height:38px">
                    <input type="checkbox" id="noticeActive" name="active"
                           th:checked="${notice != null and notice.activeYn == 'Y'}" />
                    <span>지금 노출</span>
                  </label>
                </div>
              </div>
              <div class="hub-edit__actions" style="margin-top:16px;justify-content:flex-end">
                <button type="reset" class="hub-btn hub-btn--sm">되돌리기</button>
                <button type="submit" class="hub-btn hub-btn--primary hub-btn--sm">공지 저장</button>
              </div>
            </form>

            <div>
              <div class="adm-preview__label">미리보기</div>
              <div class="hub-notice" id="noticePreview">
                <span class="hub-notice__icon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
                </span>
                <span class="hub-notice__msg" data-notice-preview
                      th:text="${notice != null and notice.message != null and !#strings.isEmpty(notice.message)} ? ${notice.message} : '메시지를 입력하면 여기에 보입니다.'">메시지</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!--/* 링크 추가 — 상시 노출 폼 대신 우측 슬라이드 패널 */-->
  <div class="adm-drawer" id="addDrawer" hidden role="dialog" aria-modal="true" aria-label="링크 추가">
    <div class="adm-drawer__panel">
      <div class="adm-drawer__head">
        <h2 class="adm-drawer__title">링크 추가</h2>
        <button type="button" class="adm-drawer__close" data-drawer-close aria-label="닫기">×</button>
      </div>
      <form th:action="@{/admin/company-links}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="hub-field" style="margin-bottom:12px"><label for="addTitle">이름</label>
          <input class="hub-input" type="text" id="addTitle" name="title" maxlength="100" required placeholder="예) 상담 CRM" /></div>
        <div class="hub-field" style="margin-bottom:12px"><label for="addUrl">URL</label>
          <input class="hub-input" type="url" id="addUrl" name="url" maxlength="500" required placeholder="https://example.com" /></div>
        <div class="hub-field" style="margin-bottom:12px"><label for="addCategory">분류</label>
          <input class="hub-input" type="text" id="addCategory" name="category" maxlength="80" list="admCategories" placeholder="예) 병원" />
          <datalist id="admCategories">
            <option th:each="cat : ${categoryRows}" th:value="${cat.name}"></option>
          </datalist></div>
        <div class="hub-field" style="margin-bottom:12px"><label for="addSortOrder">정렬 순서</label>
          <input class="hub-input" type="number" id="addSortOrder" name="sortOrder" min="0" max="9999" value="0" /></div>
        <div class="hub-field" style="margin-bottom:16px"><label for="addDescription">설명</label>
          <textarea class="hub-textarea" id="addDescription" name="description" maxlength="500" placeholder="간단한 설명"></textarea></div>
        <button class="hub-btn hub-btn--primary hub-btn--block" type="submit">추가</button>
      </form>
    </div>
  </div>

  <script th:src="@{/js/hub-admin.js}"></script>
</body>
</html>
