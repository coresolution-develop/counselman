# prod profile settings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=true

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=31536000
spring.web.resources.chain.cache=true

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.thymeleaf=INFO
logging.level.com.coresolution.csm=INFO

# 운영 DB — 접속정보는 전부 환경변수로 주입한다(기본값 없음, 미설정 시 기동 실패).
# 주입 위치: systemd EnvironmentFile (/etc/default/csm-next-deploy 계열). .env.example 참고.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# [2단계] 세션 외부화 — 인메모리 → MySQL(JDBC). DDL(scripts/spring-session-mysql.sql) 선행 필수.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

login.aes-key=${LOGIN_AES_KEY}

# 운영 외부 도메인 (비밀번호 재설정 링크 baseline)
csm.base-url=${CSM_BASE_URL:https://csm.sosyge.net/csm}

# 운영 업로드 저장 경로
app.counsel.audio.base-dir=${COUNSEL_AUDIO_BASE_DIR:/mnt/csm-audio}
app.counsel.file.base-dir=${COUNSEL_FILE_BASE_DIR:/mnt/csm-counsel-files}

# Bizppurio (PROD)
sms.bizppurio.token-url=${BIZPPURIO_TOKEN_URL:https://api.bizppurio.com/v1/token}
sms.bizppurio.message-url=${BIZPPURIO_MESSAGE_URL:https://api.bizppurio.com/v3/message}
sms.bizppurio.account=${BIZPPURIO_PROD_ACCOUNT}
sms.bizppurio.username=${BIZPPURIO_PROD_USERNAME}
sms.bizppurio.password=${BIZPPURIO_PROD_PASSWORD}
