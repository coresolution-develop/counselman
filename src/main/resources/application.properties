# 기본 프로파일: 서버/배포 환경 안전값(dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=csm

# 공통 서버 설정
server.port=8081
server.servlet.context-path=/csm
# idle 30분. 단, 백그라운드 폴링(notice/popup 60s 등)이 lastAccessedTime을 갱신해
# idle 타임아웃을 사실상 무력화한다 → 절대 수명 캡 별도 검토 필요(보고서 참고).
server.servlet.session.timeout=1800
server.forward-headers-strategy=framework

# [1단계] Graceful shutdown — 종료 시 처리 중이던 요청을 끊지 않고 마무리
# (내장 Tomcat에서 완전 동작. 외장 Tomcat WAR 배포 시 커넥터 드레이닝은
#  Tomcat shutdown.sh + 밸런서 drain[3·4단계]이 실제 레버다 — 보고서 참고)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# [2단계] 세션 외부화(JDBC)는 배포 환경(dev/prod) 프로파일에만 설정한다.
# local은 인메모리 유지(DDL 없이 부팅 가능). 적용 전 DDL 선행 필수:
#   scripts/spring-session-mysql.sql (SPRING_SESSION, SPRING_SESSION_ATTRIBUTES)

# 전사 링크 허브 — 개인화 회원 가입코드(자가가입 시 검증). 비우면 코드 검증 생략(완전 오픈, 비권장).
hub.signup.code=${HUB_SIGNUP_CODE:core}
# "이 기기 기억하기" 영속 로그인: 토큰 유효기간(일)과 쿠키 Secure 속성.
# cookie-secure는 운영(HTTPS) 기본 true. 로컬 http 검증 시에만 false로 내릴 것.
hub.remember.days=${HUB_REMEMBER_DAYS:30}
hub.remember.cookie-secure=${HUB_REMEMBER_COOKIE_SECURE:true}

# 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.counsel.audio.base-dir=${COUNSEL_AUDIO_BASE_DIR:${user.home}/csm-audio}
app.counsel.file.base-dir=${COUNSEL_FILE_BASE_DIR:${user.home}/csm-counsel-files}
# 리스트 항목설정 모달/리스트에서 숨길 컬럼명(콤마 구분)
app.counsel.list.hidden-columns=cs_idx,cs_col_01_hash,created_at,updated_at

# CLOVA Speech
ncp.clova.invoke-url=${NCP_CLOVA_INVOKE_URL:}
ncp.clova.secret-key=${NCP_CLOVA_SECRET_KEY:}
ncp.clova.grpc-url=${NCP_CLOVA_GRPC_URL:clovaspeech-gw.ncloud.com:50051}

# OpenAI GPT 요약
openai.api.base-url=https://api.openai.com/v1
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=gpt-4.1-mini

# 템플릿 공통
spring.thymeleaf.suffix=.html

# 관리자 부서코드
app.admin.sub-code=CORE

# 외부에서 접근 가능한 CSM 절대 URL (비밀번호 재설정 링크 등 메일/SMS 본문에 포함)
# 빈 값이면 요청 헤더(X-Forwarded-Host) 기반 자동 감지로 폴백. 운영에선 반드시 명시.
csm.base-url=${CSM_BASE_URL:}

# Kakao OAuth2 (챗봇 사용자 로그인)
# KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET 은 필수 환경변수다(기본값 없음).
#
# ⚠️ **미설정이어도 기동은 된다.** 예전 주석은 "기동 실패" 라고 적혀 있었는데 틀렸다.
#    이 값들은 @ConfigurationProperties(OAuth2ClientProperties)로 바인딩되고,
#    @Value 와 달리 **미해결 플레이스홀더를 조용히 문자열로 남긴다.**
#    실측: clientId 가 문자열 "${KAKAO_CLIENT_ID}" 인 채로 기동됐다 (2026-08-27).
#    깨진 것은 **사용자가 카카오 로그인을 눌러야** 드러난다.
#    ContextWiringTest.해석되지_않은_플레이스홀더가_남지_않는다() 가 이제 이걸 잡는다.
# redirect-uri는 Kakao 콘솔에 사전 등록 필요.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# MediPlat SSO
mediplat.platform.base-url=${MEDIPLAT_PLATFORM_BASE_URL:http://localhost:8082}
mediplat.sso.shared-secret=${MEDIPLAT_SSO_SHARED_SECRET:${COUNSELMAN_MEDIPLAT_SSO_SHARED_SECRET:}}
mediplat.sso.allowed-clock-skew-seconds=${MEDIPLAT_SSO_ALLOWED_CLOCK_SKEW_SECONDS:60}
# SSO 토큰 유효기간 상한(초). 발급 측(mediplat) 기본값은 60초다.
# 하한만 검사하면 발급 측이 expires를 크게 잡을수록 토큰이 오래 유효해진다. 0이면 검사 안 함.
mediplat.sso.max-ttl-seconds=${MEDIPLAT_SSO_MAX_TTL_SECONDS:300}
mediplat.sso.default-target=${MEDIPLAT_SSO_DEFAULT_TARGET:/counsel/list?page=1&perPageNum=10&comment=}

# Platform admin bootstrap
platform.admin.bootstrap.enabled=${PLATFORM_ADMIN_BOOTSTRAP_ENABLED:false}
platform.admin.username=${PLATFORM_ADMIN_USERNAME:coreadmin}
# platform.admin.password 는 여기에 두지 않는다. PLATFORM_ADMIN_PASSWORD 환경변수가
# Spring relaxed binding으로 그대로 바인딩된다. 미설정이면 값이 비고, bootstrap은
# PlatformAdminBootstrapService에서 WARN 로그 후 skip된다(기동은 정상).
platform.admin.name=${PLATFORM_ADMIN_NAME:Platform Admin}
platform.admin.email=${PLATFORM_ADMIN_EMAIL:}
platform.admin.phone=${PLATFORM_ADMIN_PHONE:}
platform.admin.department=${PLATFORM_ADMIN_DEPARTMENT:MediPlat}
platform.admin.position=${PLATFORM_ADMIN_POSITION:Platform Administrator}
platform.admin.note=${PLATFORM_ADMIN_NOTE:Bootstrap platform administrator}
platform.admin.sync-password-on-startup=${PLATFORM_ADMIN_SYNC_PASSWORD_ON_STARTUP:false}

# Bizppurio HTTP 타임아웃 (전 프로파일 공통)
# read-timeout이 없으면 무한 대기가 되어 응답 지연 시 톰캣 워커 스레드가 묶인다.
# 발송 호출에서 타임아웃이 나면 접수 여부를 알 수 없으므로(결과 불명) 재시도하지 않는다.
sms.bizppurio.connect-timeout=${BIZPPURIO_CONNECT_TIMEOUT_MS:5000}
sms.bizppurio.read-timeout=${BIZPPURIO_READ_TIMEOUT_MS:10000}

# 배치 문자 발송 (POST /api/counsel/sms/batch)
# max-recipients: 현 규모(일 40~50건)에서 500건 초과 요청은 사고일 가능성이 높아 거부한다.
# send-delay-ms: 비즈뿌리오 호출 간 지연. Rate Limit 완충용.
#
# ── 이 값을 올리려는 사람이 먼저 읽을 것 ────────────────────────────────────
#
# 1) 금액 오버플로 (CSM-1 에서 해소됨)
#    total_cost 는 long/BIGINT 다. unit_cost × 건수 상한이 9.2e18전이라
#    사실상 걸리지 않는다. 단, total_cost 를 int 로 되돌리면 상한이
#    2,147,483,647전으로 급락해 아래 식이 다시 살아난다:
#        안전 건수 = 2,147,483,647 / unit_cost(전)
#        예) 단가 960전(9.6원) → 2,236,962건 / 단가 7000전(70원) → 306,783건
#    금액 계산을 int 로 바꾸는 변경은 하지 말 것.
#
# 2) 실제로 먼저 부딪히는 것은 "요청 처리 시간"이다 ← 지금의 진짜 제약
#    발송은 순차 처리이고 건마다 send-delay-ms 만큼 쉰다. 게이트웨이 왕복을
#    빼고 지연만 계산해도:
#        최소 소요 = (건수 - 1) × send-delay-ms
#        500건 → 약 50초 / 2,000건 → 약 3.3분 / 10,000건 → 약 16.6분
#    이것이 단일 동기 HTTP 요청 안에서 일어난다. 톰캣·프록시·브라우저
#    타임아웃에 먼저 걸린다. 수천 건 이상을 보내려면 값만 올릴 게 아니라
#    비동기 큐로 구조를 바꿔야 한다.
#
# 3) 건수 컬럼은 INT 다 (total_count/success_count/failed_count/unknown_count).
#    21억 건이 상한이지만 2) 때문에 도달할 수 없다.
# ──────────────────────────────────────────────────────────────────────────
csm.sms.batch.max-recipients=${CSM_SMS_BATCH_MAX_RECIPIENTS:500}
csm.sms.batch.send-delay-ms=${CSM_SMS_BATCH_SEND_DELAY_MS:100}

# 단가 폴백 (전 단위 정수, 9.6원=960). inst_data_cs 단가가 없거나 파싱 불가일 때만 사용.
csm.sms.price-fallback.sms-jeon=${CSM_SMS_PRICE_FALLBACK_SMS:960}
csm.sms.price-fallback.lms-jeon=${CSM_SMS_PRICE_FALLBACK_LMS:3000}
csm.sms.price-fallback.mms-jeon=${CSM_SMS_PRICE_FALLBACK_MMS:9000}

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:dev@coresolution.kr}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}

# ── 단가 배포 (CSM-3) ────────────────────────────────────────
# 플랫폼(MediCast)에서 단가를 받아온다. 비어 있으면 폴링하지 않고
# 기존 동작(inst_data_cs → 폴백 단가)이 그대로 유지된다.
csm.sms.price.platform-base-url=${CSM_PRICE_PLATFORM_BASE_URL:}
csm.sms.price.platform-api-key=${CSM_PRICE_PLATFORM_API_KEY:}
csm.sms.price.request-timeout-ms=${CSM_PRICE_REQUEST_TIMEOUT_MS:5000}

# 폴링 주기. 단가 변경은 최대 이 시간만큼 지연된다.
# **즉시 트리거는 만들지 않는다** — 플랫폼이 csm 을 호출하면 격리가 깨진다.
csm.sms.price.poll-interval-ms=${CSM_PRICE_POLL_INTERVAL_MS:300000}
csm.sms.price.poll-initial-delay-ms=${CSM_PRICE_POLL_INITIAL_DELAY_MS:30000}

# 업무 상한(전). 플랫폼이 보낸 값이라도 이걸 넘으면 거부하고 이전 값을 유지한다.
# 100000전 = 1,000원. 플랫폼 쪽 실수가 csm 과금에 그대로 흘러드는 것을 막는다.
csm.sms.price.max-jeon=${CSM_SMS_PRICE_MAX_JEON:100000}

# 단가 수신이 낡았다고 판정하는 기준(분). 관리자 화면(/core/smssetting) 표시에만 쓴다.
#
# 플랫폼 PLAT-1 의 PRICE_POLL_STALE_MINUTES 와 **같은 값**을 쓴다.
# 근거: 폴링 주기(5분)의 3배 — 2회 연속 실패까지는 일시적 오류로 본다.
# 폴링 주기를 바꾸면 이 값도 같이 조정한다. 두 화면이 같은 상황을 다르게 말하면 안 된다.
csm.sms.price.stale-minutes=${CSM_PRICE_STALE_MINUTES:15}

# ── 사용량 이벤트 전송 (CSM-4) ──
# 접속 정보는 단가 수신과 같은 것을 쓴다 (csm.sms.price.platform-*). 같은 플랫폼이다.
# URL 이 비어 있으면 outbox 에 쌓이기만 하고 전송은 하지 않는다 — 배포 1단계의 정상 상태다.
csm.sms.usage.request-timeout-ms=${CSM_USAGE_REQUEST_TIMEOUT_MS:5000}
csm.sms.usage.send-interval-ms=${CSM_USAGE_SEND_INTERVAL_MS:60000}
csm.sms.usage.send-initial-delay-ms=${CSM_USAGE_SEND_INITIAL_DELAY_MS:45000}
csm.sms.usage.batch-size=${CSM_USAGE_BATCH_SIZE:50}

# 누락 스캔 지연(분). **가장 느린 배치보다 길어야** 정상 진행 중인 배치를 누락으로 오인하지 않는다.
# 근거: max-recipients(500) × send-delay-ms(100) = 50초 + 건당 응답 1초 ≈ 9분.
# CSM_SMS_BATCH_MAX_RECIPIENTS 를 올리면 이 값도 같이 올린다.
csm.sms.usage.recover-delay-minutes=${CSM_USAGE_RECOVER_DELAY_MINUTES:10}

# ── 기관 동기화 (CSM-6) ──
# refreshFromPlatform() 주기. 예전에는 기동 시와 SSO 실패 시에만 돌아
# **use_yn 변경이 영영 반영되지 않았다.**
#
# 10분인 이유: 이 함수는 기관마다 DDL 보강 + 사용자 동기화를 하고 전 기관 UNION 뷰를
# 다시 만든다. 대부분 no-op 이지만 공짜는 아니다. 1분은 과하고 1시간은 비활성화가 늦다.
# ⚠️ **기관 수가 늘면 재검토한다** (지금 6곳). 뷰는 목록이 바뀔 때만 다시 만든다.
csm.inst-sync.interval-ms=${CSM_INST_SYNC_INTERVAL_MS:600000}

# 기동 직후 한 번 더 돌지 않도록 주기와 같게 둔다 — @PostConstruct 가 이미 돌렸다.
csm.inst-sync.initial-delay-ms=${CSM_INST_SYNC_INITIAL_DELAY_MS:600000}
