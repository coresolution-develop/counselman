# 테스트 전용 MySQL.
#
# ── 왜 별도 컨테이너인가 ──
# csm 은 DB 접속 정보를 환경변수로만 받는다. 로컬에 csm DB 가 없어서
# `@Tag("integration")` 테스트를 아무 데서도 돌릴 수 없는 상태였다.
#
# **개발·운영 DB 를 쓰지 않는다.** 플랫폼 쪽에서 계약 테스트가 개발 DB 를
# 비운 사고가 있었다. csm 은 병원 6곳이 실제로 쓰는 시스템이라 같은 일이 나면
# 훨씬 나쁘다.
#
# ── 포트 3309 ──
# 실측으로 골랐다 (2026-08-26).
#   3306  호스트 mysqld (다른 프로젝트 11개 스키마)
#   3307  formflow-mysql  (Colima 포워딩이라 `ssh` 프로세스로 보인다)
#   3308  pe-v2-mysql
#   3309  비어 있음  ← 여기
#
# 포트는 반드시 실측한다. `lsof -nP -iTCP:3309 -sTCP:LISTEN` 이 비어야 한다.

services:
  csm-test-mysql:
    image: mysql:8.0
    container_name: csm-test-mysql
    # 컨테이너 이름이 곧 신원이다. 테스트가 접속 대상을 이 이름으로 확인한다.
    ports:
      - '3309:3306'
    environment:
      MYSQL_ROOT_PASSWORD: csm_test_pw
      MYSQL_DATABASE: csm
      # ⚠️ 로컬 테스트 전용 비밀번호다. 운영에서는 시크릿 매니저로 주입한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pcsm_test_pw']
      interval: 3s
      timeout: 3s
      retries: 20
    # 데이터를 볼륨에 남기지 않는다. 테스트 DB 는 매번 새로 만드는 것이 맞고,
    # 남아 있으면 이전 실행의 상태가 다음 실행에 새어 든다.
    tmpfs:
      - /var/lib/mysql
