# 테스트 전용 설정. 운영/개발 설정을 덮어쓴다.
#
# main 쪽 application.properties 는 시크릿에 기본값을 두지 않는다(미설정 시 기동 실패).
# @SpringBootTest 는 환경변수 없이 컨텍스트를 띄우므로 여기에 더미 값을 둔다.
# 실제 비밀값을 절대 넣지 말 것 — 이 파일은 커밋된다.
cancer-treatment.sso.shared-secret=test-shared-secret

# 테스트는 항상 격리된 H2 인메모리를 쓴다. 개발자 셸에 SPRING_DATASOURCE_* 가 export 되어
# 있어도 실 DB에 붙지 않도록 여기서 고정한다.
spring.datasource.url=jdbc:h2:mem:cancer_treatment_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded
