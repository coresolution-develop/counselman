name: Deploy DEV

# Push to `dev` → build on a GitHub-hosted runner, then a self-hosted runner
# ON the dev server deploys the artifact locally (no inbound SSH needed, so the
# server firewall is a non-issue).
#
# SETUP: register a self-hosted runner on the dev server with the label `dev`
#   (Settings → Actions → Runners → New self-hosted runner; add `--labels dev`).
#   The runner user needs write access to the deploy paths and sudo for
#   systemctl (simplest: run the runner as root).

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build DEV packages
        run: ./gradlew packageDevDeploy --console=plain
      - name: Checksum artifacts
        # Recorded at the source so the deploy job can prove the bytes that
        # reach the dev server are the bytes that were built here. A truncated
        # csm.war once shipped to prod unnoticed and took the service down.
        run: |
          cd build/deploy/dev
          sha256sum csm-dev.war mediplat-dev.jar links-dev.jar | tee SHA256SUMS
          ls -l csm-dev.war mediplat-dev.jar links-dev.jar
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy
          path: |
            build/deploy/dev/csm-dev.war
            build/deploy/dev/mediplat-dev.jar
            build/deploy/dev/links-dev.jar
            build/deploy/dev/SHA256SUMS
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, dev]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-deploy
          path: artifact
      - name: Verify artifacts before deploying
        # dev has no staging step: the next job copies straight over the live
        # files and restarts. Verify everything up front so a corrupt artifact
        # cannot take the service down, and so a bad file never leaves half the
        # apps replaced. Checksum catches a truncated/altered transfer; the
        # archive test catches a file of the right size that is not a readable
        # zip.
        run: |
          cd artifact
          sha256sum -c SHA256SUMS
          unzip -t csm-dev.war > /dev/null
          unzip -t mediplat-dev.jar > /dev/null
          unzip -t links-dev.jar > /dev/null
          ls -l csm-dev.war mediplat-dev.jar links-dev.jar
          echo "artifacts verified: checksum + archive integrity OK"
      - name: Deploy on dev server (local)
        run: |
          mkdir -p /opt/links/app
          cp artifact/csm-dev.war /usr/local/tomcat10/webapps/csm.war
          cp artifact/mediplat-dev.jar /opt/mediplat/app/mediplat.jar
          cp artifact/links-dev.jar /opt/links/app/links.jar
          sudo systemctl restart mediplat links
          echo "DEV deployed: csm.war (Tomcat auto-reload) + mediplat + links restarted"
