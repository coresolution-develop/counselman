name: Deploy PROD

# Push to `prod` → build + test on a GitHub-hosted runner, then a self-hosted
# runner ON the prod server stages the artifacts into /opt/csm-next/deploy/staging
# (no inbound SSH). The csm-next-deploy timer (02:30 KST) applies them at dawn.
#
# SETUP: register a self-hosted runner on the prod server with the label `prod`
#   (Settings → Actions → Runners → New self-hosted runner; add `--labels prod`).
#   The runner user needs write access to the Tomcat webapps dir (run as root is
#   simplest). The `prod` branch should only ever receive reviewed/tested commits.

on:
  push:
    branches:
      - prod
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      # ── 벡터 잡을 따로 띄운다 (CSM-5) ──
      #
      # 금액·기관코드 규칙이 플랫폼과 갈리면 청구가 엉킨다. 그 실패가 다른 테스트
      # 실패에 묻히면 안 되므로 **이름이 붙은 별도 스텝**으로 먼저 돌린다.
      # (플랫폼 CLAUDE.md §3.2 "CI 잡 분리")
      #
      # 이 스텝이 빨간데 아래 게이트가 초록일 수는 없다 -- 같은 테스트가 두 번 돈다.
      # 중복은 의도된 것이다: **어디서 깨졌는지가 실행 목록에서 바로 보여야 한다.**
      - name: Vector check (pricing / inst-code shared with the platform)
        run: ./gradlew test --tests '*VectorsTest' --console=plain

      - name: Test gate (abort prod deploy if red)
        # -PexcludeIntegration drops @Tag("integration") tests, which need a live DB.
        #
        # ContextWiringTest is deliberately NOT tagged: it boots the full Spring
        # context with a stub DataSource, so it runs here. That is the point --
        # CsmApplicationTests (DB-backed) was excluded in 2026-06 and nobody looked
        # at it for two months, during which its failure cause changed twice and the
        # 2026-08-13 mediplat outage (missing env -> PlaceholderResolutionException
        # crash loop) shipped. ContextWiringTest catches that class of failure here.
        #
        # If you ever tag ContextWiringTest as integration, this gate stops checking
        # whether the app can start at all.
        run: ./gradlew test --console=plain -PexcludeIntegration
      - name: Build PROD packages
        run: ./gradlew packageProdDeploy --console=plain
      - name: Checksum artifacts
        # Recorded at the source so the deploy job can prove the bytes that
        # reach the prod server are the bytes that were built here. A truncated
        # csm.war once shipped to prod unnoticed and took the service down.
        run: |
          cd build/deploy/prod
          sha256sum csm-prod.war mediplat-prod.jar | tee SHA256SUMS
          ls -l csm-prod.war mediplat-prod.jar
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-deploy
          # sms/links are built by packageProdDeploy but the nightly deploy
          # script only knows csm.war / mediplat.jar / cancer-treatment.jar,
          # so only ship what it can actually install.
          path: |
            build/deploy/prod/csm-prod.war
            build/deploy/prod/mediplat-prod.jar
            build/deploy/prod/SHA256SUMS
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, prod]
    # Gate: waits for a required reviewer to approve in the Actions UI before
    # the artifact touches the live prod server (GitHub Environment `prod`).
    environment: prod
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-deploy
          path: artifact
      - name: Verify artifacts before staging
        # Fail loudly here rather than let a corrupt file sit in staging until
        # the 02:30 timer copies it over the live app. Checksum catches a
        # truncated/altered transfer; the archive test catches a file that is
        # the right size but not a readable zip.
        run: |
          cd artifact
          sha256sum -c SHA256SUMS
          unzip -t csm-prod.war > /dev/null
          unzip -t mediplat-prod.jar > /dev/null
          ls -l csm-prod.war mediplat-prod.jar
          echo "artifacts verified: checksum + archive integrity OK"
      - name: Stage artifacts for scheduled (dawn) deploy
        run: |
          STAGING=/opt/csm-next/deploy/staging
          # Do NOT deploy directly. Drop the artifacts into the staging dir +
          # deploy.ok marker; the csm-next-deploy timer (02:30 KST) applies them
          # and restarts csm-next / mediplat-next. Atomic rename so a timer never
          # sees a half-written file. Staged names must match what
          # deploy-nightly.sh looks for (csm.war, mediplat.jar).
          cp artifact/csm-prod.war "$STAGING/csm.war.new"
          mv -f "$STAGING/csm.war.new" "$STAGING/csm.war"
          cp artifact/mediplat-prod.jar "$STAGING/mediplat.jar.new"
          mv -f "$STAGING/mediplat.jar.new" "$STAGING/mediplat.jar"
          # Marker last: the script deploys everything present once it sees this.
          touch "$STAGING/deploy.ok"
          echo "Staged csm.war + mediplat.jar -> $STAGING + deploy.ok. Scheduled deploy timer will apply them at the next window."
